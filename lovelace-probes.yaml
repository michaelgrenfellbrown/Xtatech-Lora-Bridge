              }
              .state {
                font-size: 5px !important;
                line-height: 6px !important;
                margin: 0 !important;
              }
              .state__uom {
                font-size: 4px !important;
              }
        - type: custom:mini-graph-card
          entities:
            - entity: sensor.[[prefix]]_temperature
