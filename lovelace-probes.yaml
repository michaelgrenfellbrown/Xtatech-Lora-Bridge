decluttering_templates:
  aqua_node_row:
    card:
      type: horizontal-stack
      card_mod:
        style: |
          :host {
            display: block;
            margin-bottom: 6px;
          }
          #root {
            align-items: stretch !important;
            gap: 8px !important;
          }
      cards:
        - type: custom:button-card
          entity: sensor.[[prefix]]_last_seen
          name: '[[display_name]]'
          icon: mdi:sprout
          show_icon: true
          show_name: true
          show_state: false
          tap_action:
            action: more-info
          triggers_update:
            - sensor.[[prefix]]_battery
            - sensor.[[prefix]]_temperature
            - sensor.[[prefix]]_humidity
            - sensor.[[prefix]]_ph
            - sensor.[[prefix]]_last_seen
          custom_fields:
            status: |
              [[[
                const e = states['sensor.[[prefix]]_last_seen'];
                return (!e || ['unknown','unavailable'].includes(e.state))
                  ? 'OFFLINE' : 'ONLINE';
              ]]]
            readings: |
              [[[
                const val = (id, suffix = '') => {
                  const e = states[id];
                  return (!e || ['unknown','unavailable','none'].includes(e.state))
                    ? '—' : `${e.state}${suffix}`;
                };
                return `
                  <span><b>Bat</b>&nbsp;${val('sensor.[[prefix]]_battery',' V')}</span>
                  <span><b>Temp</b>&nbsp;${val('sensor.[[prefix]]_temperature',' °C')}</span>
                  <span><b>Moist</b>&nbsp;${val('sensor.[[prefix]]_humidity',' %')}</span>
                  <span><b>pH</b>&nbsp;${val('sensor.[[prefix]]_ph')}</span>
                `;
              ]]]
          state:
            - operator: template
              value: |
                [[[
                  const e = states['sensor.[[prefix]]_last_seen'];
                  return !e || ['unknown','unavailable'].includes(e.state);
                ]]]
              styles:
                card:
                  - opacity: 0.55
                icon:
                  - color: var(--error-color)
                custom_fields:
                  status:
                    - color: var(--error-color)
            - operator: default
              styles:
                icon:
                  - color: var(--success-color)
                custom_fields:
                  status:
                    - color: var(--success-color)
          styles:
            card:
              - height: 58px
              - padding: 2px 6px
              - border-radius: 8px
            grid:
              - grid-template-areas: '"i n status" "i readings readings"'
              - grid-template-columns: 28px 72px 1fr
              - grid-template-rows: 20px 1fr
              - column-gap: 5px
            icon:
              - width: 21px
            name:
              - justify-self: start
              - font-size: 11px
              - font-weight: 700
            custom_fields:
              status:
                - justify-self: end
                - font-size: 9px
                - font-weight: 700
              readings:
                - justify-self: stretch
                - display: flex
                - flex-wrap: wrap
                - gap: 2px 8px
                - font-size: 9px
                - line-height: 11px
        - type: custom:mini-graph-card
          entities:
            - entity: sensor.[[prefix]]_humidity
          name: Moist
          hours_to_show: 24
          points_per_hour: 1
          aggregate_func: avg
          line_width: 2
          height: 24
          font_size: 10
          decimals: 1
          lower_bound: 0
          show:
            icon: false
            labels: false
            extrema: false
            fill: false
            points: false
            legend: false
            name: true
            state: true
          card_mod:
            style: |
              ha-card {
                height: 58px !important;
                min-height: 58px !important;
                max-height: 58px !important;
                box-sizing: border-box !important;
                padding: 0 4px !important;
                border-radius: 8px;
                overflow: hidden !important;
              }
              .graph {
                height: 24px !important;
                max-height: 24px !important;
                overflow: hidden !important;
              }
              .graph__container {
                height: 24px !important;
