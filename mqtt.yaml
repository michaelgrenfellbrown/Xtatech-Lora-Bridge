    default_entity_id: "sensor.lora_gateway_pi_zero2_gw01_pi_zero2_gw01_last_serial_rx"
    state_topic: "lora/_gateway/pi-zero2-gw01/state"
    value_template: "{{ value_json.last_serial_rx_iso | default(None) }}"
