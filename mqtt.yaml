# Manual Home Assistant MQTT entities for Xtatech LoRa Bridge.
# The bridge does not update this file, and MQTT discovery should stay disabled.
#
# Put this file in your Home Assistant config folder and include it from
# configuration.yaml like this:
#
# mqtt: !include mqtt.yaml
#
# State topics match the bridge default:
#   lora/<node_id>/state

sensor:
  - name: "aqua01 Battery"
    unique_id: "lora_aqua01_bat"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.bat | default(None) }}"
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    device: &device_aqua01
      identifiers:
        - "lora_aqua01"
      name: "LoRa aqua01"
      manufacturer: "Xtatech"
      model: "LoRa Sensor Node"
  - name: "aqua01 Temperature"
    unique_id: "lora_aqua01_temp"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.temp | default(None) }}"
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    device: *device_aqua01
  - name: "aqua01 Humidity"
    unique_id: "lora_aqua01_humi"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.humi | default(None) }}"
    device_class: humidity
    state_class: measurement
    unit_of_measurement: "%"
    device: *device_aqua01
  - name: "aqua01 pH"
    unique_id: "lora_aqua01_ph"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.PH | default(None) }}"
    state_class: measurement
    unit_of_measurement: "pH"
    device: *device_aqua01
  - name: "aqua01 Sleep"
    unique_id: "lora_aqua01_sleep"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.SLEEP | default(None) }}"
    state_class: measurement
    unit_of_measurement: "s"
    device: *device_aqua01
  - name: "aqua01 Count"
    unique_id: "lora_aqua01_count"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.COUNT | default(None) }}"
    state_class: total_increasing
    device: *device_aqua01
  - name: "aqua01 RSSI"
    unique_id: "lora_aqua01_rssi"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.rssi | default(None) }}"
    device_class: signal_strength
    state_class: measurement
    unit_of_measurement: "dBm"
    device: *device_aqua01
  - name: "aqua01 Last Seen"
    unique_id: "lora_aqua01_last_seen"
    state_topic: "lora/aqua01/state"
    value_template: "{{ value_json.ts_iso | default(None) }}"
    device_class: timestamp
    device: *device_aqua01

